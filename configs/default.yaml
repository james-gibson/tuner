version: "1.0"

mode: broadcast

health:
  listen_addr: "127.0.0.1:8092"

broadcast:
  listen: "127.0.0.1:8093"
  advertise: "_tuner._tcp"
  # caller_enabled: true
  # audience:
  #   enabled: true
  #   allow_mdns: "_smoke-alarm._tcp"

receive:
  mdns_service: "_tuner._tcp"
  persist_subscriptions: "~/.config/tuner/subscriptions.json"

mdns:
  service_type: "_tuner._tcp"
  # Registered isotope types to browse — these carry role/trust_rung in TXT.
  isotope_types: ["_adhd-isotope._tcp"]
  port: 8093
  refresh_interval: "30s"
  domains: ["tuner.local"]
  txt_record:
    version: "1.0"

# feature_browser: the adhd certification view behind the generated
# adhd-features channel and `tuner features`. Discovery over mDNS
# (_adhd-isotope._tcp) is primary; endpoints are the fallback for when mDNS is
# unavailable. A bare origin gets the conventional /mcp path. identity is
# tuner's own instance id for the MCP handshake — adhd assigns rungs, so this is
# an identity, never a rung.
# feature_browser:
#   refresh: "30s"
#   identity: "tuner:8093"
#   endpoints:
#     - name: adhd-tui
#       url: "http://127.0.0.1:9090"

channels:
  preset:
    - name: ntp
      type: ntp
      interval: 5s
    - name: dns
      type: dns
      targets:
        - google.com
        - cloudflare.com
      interval: 10s
    - name: ping
      type: ping
      targets:
        - 8.8.8.8
      interval: 2s
  # notes: RSS-shaped feeds of prep questions, surfaced on the broadcast.
  # Content is authored elsewhere (kb/scripts/lab/search/notes.py export);
  # tuner only presents the newest items. Deliberately not advertised in llms.txt.
  # notes:
  #   - name: prep
  #     source: "~/.local/share/kb-lab/notes.feed.xml"
  #     refresh: "30s"
  #
  # custom:
  #   # Custom channels are served from their own source, so a declaration
  #   # needs one. Nothing is declared by default; the four shapes are:
  #   - name: github-actions
  #     source:
  #       type: http
  #       url: "https://api.github.com/repos/{owner}/{repo}/actions/runs"
  #     auth:
  #       type: bearer
  #       token: "${GITHUB_TOKEN}"
  #     refresh: "30s"
  #     theme:
  #       color: "#FF6B6B"
  #
  #   # sse: tuner reconnects per refresh and keeps the first event's data.
  #   - name: smoke-alarm-stream
  #     source:
  #       type: sse
  #       url: "http://127.0.0.1:8080/events"
  #     refresh: "15s"
  #
  #   # command: stdout, parsed as JSON when it is JSON, lines otherwise.
  #   - name: lab-state
  #     source:
  #       type: command
  #       command: "kb lab state --json"
  #     refresh: "30s"
  #
  #   # webhook: POST /channels/<name>/ingest. With auth.token set the push must
  #   # carry `Authorization: Bearer <token>`; without one it is accepted from
  #   # loopback only, whatever the broadcast listener is bound to.
  #   - name: alarm-push
  #     source:
  #       type: webhook
  #     auth:
  #       type: bearer
  #       token: "${TUNER_INGEST_TOKEN}"

signal:
  max_age: "30m"
  decay_linear: true
  viz_bars: 12

tv:
  cable_dir: "~/.config/television/cable" # TV's default cable directory (reference only)
  tuner_dir: "~/.config/tuner/cable" # isolated directory for tuner-managed channels
  auto_launch: true
  isolate: false # if true, tuner channels are kept separate from TV defaults

logging:
  level: info
  output: console
